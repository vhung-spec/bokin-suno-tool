# Tests Lời Đồng Âm on a fresh Windows and a fresh Linux: the engine with Node, then the page opened from disk in
# Chromium and used like a person would, then the one-file build for Claude.
name: Loi Dong Am

on:
  push:
    paths:
      - "loi-dong-am/**"
      - "tests/engine.test.js"
      - "tests/page.test.js"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Engine
        run: npm test

      - name: Page
        run: npm run test:page

      - name: One-file build
        run: npm run build:artifact
